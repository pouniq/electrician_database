{% extends "base.html" %}
{% block title %}Add Client — Site Log{% endblock %}
{% block content %}
{% set active = 'clients' %}

<div class="page-header">
  <div>
    <h2>Add client</h2>
    <div class="sub">Contact and site details</div>
  </div>
</div>

<form class="stack" method="POST">
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="field">
    <label for="phone">Phone</label>
    <input type="text" id="phone" name="phone">
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email">
  </div>
  <div class="field">
    <label for="address">Address</label>
    <input type="text" id="address" name="address">
  </div>
  <div class="field">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" placeholder="Panel type, access notes, gate code, etc."></textarea>
  </div>
  <button class="btn" type="submit">Save client</button>
  <a class="btn btn-quiet" style="margin-left:8px;" href="{{ url_for('clients') }}">Cancel</a>
</form>
{% endblock %}
