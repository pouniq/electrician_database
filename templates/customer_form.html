{% extends "base.html" %}
{% block title %}اضافه کردن مشتری{% endblock %}
{% block content %}
{% set active = 'customers' %}

<div class="page-header">
  <div>
    <h2>اضافه کردن مشتری</h2>
    <div class="sub">راه های ارتباطی</div>
  </div>
</div>

<form class="stack" method="POST">
  <div class="field">
    <label for="name">نام</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="field">
    <label for="last_name">نام خانوادگی</label>
    <input type="text" id="last_name" name="last_name" required>
  </div>
  <div class="field">
    <label for="phone">شماره تماس</label>
    <input type="text" id="phone" name="phone">
  </div>
  <div class="field">
    <label for="address">آدرس</label>
    <input type="text" id="address" name="address">
  </div>
  <div class="field">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" placeholder="Panel type, access notes, gate code, etc."></textarea>
  </div>
  <button class="btn" type="submit">Save client</button>
  <a class="btn btn-quiet" style="margin-left:8px;" href="{{ url_for('customers') }}">Cancel</a>
</form>
{% endblock %}
