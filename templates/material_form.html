{% extends "base.html" %}
{% block title %}Log Materials — Site Log{% endblock %}
{% block content %}
{% set active = 'materials' %}

<div class="page-header">
  <div>
    <h2>ثبت وسایل</h2>
    <div class="sub">وصل به فایل کار</div>
  </div>
</div>

{% if jobs %}
<form class="stack" method="POST">
  <div class="field">
    <label for="job_id">کار</label>
    <select id="job_id" name="job_id" required>
      {% for j in jobs %}
      <option value="{{ j.id }}">{{ j.title }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="name">نام</label>
    <input type="text" id="name" name="name" placeholder="e.g. 12/2 Romex, 100ft" required>
  </div>
  <div class="field">
    <label for="quantity">تعداد</label>
    <input type="number" step="0.01" id="quantity" name="quantity" value="1">
  </div>
  <div class="field">
    <label for="unit_cost">قیمت هر کدام</label>
    <input type="number" step="0.01" id="unit_cost" name="unit_cost" value="0">
  </div>
  <button class="btn" type="submit">ذخیر وسایل</button>
  <a class="btn btn-quiet" style="margin-left:8px;" href="{{ url_for('materials') }}">Cancel</a>
</form>
{% else %}
<div class="empty">یک کار را ثبت کنید بعد وسایل را وارد کنید. <a href="{{ url_for('add_job') }}">یک وسیله را ثبت کنید.</a>.</div>
{% endif %}
{% endblock %}
